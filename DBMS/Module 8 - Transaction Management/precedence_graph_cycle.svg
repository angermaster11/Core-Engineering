<text x="280" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" font-style="italic" fill="#475569">T1→T2 (on A)</text>
<line x1="420" y1="222" x2="140" y2="222" stroke="#333" stroke-width="2.5" marker-end="url(#arr)"/>
