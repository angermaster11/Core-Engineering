<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
<defs><marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0, 10 3.5, 0 7" fill="#333"/></marker></defs>
<text x="280" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b">Precedence Graph — Cycle</text>
<text x="280" y="56" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">R1(A), W1(A), R2(A), W2(B), R1(B), W1(B)</text>
<circle cx="140" cy="170" r="52" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
<text x="140" y="178" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1e293b">T1</text>
<circle cx="420" cy="170" r="52" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/>
